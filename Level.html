<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Level Devil Mobile</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
        }
        #orientation-warning {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #222; color: #fff;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 9999; text-align: center; padding: 20px;
        }
        @media (orientation: landscape) {
            #orientation-warning { display: none; }
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background: #1a1a1a;
        }
        canvas {
            background: #222;
            display: block;
            max-width: 100%;
            max-height: 70vh;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        #ui-overlay {
            position: absolute;
            top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between;
            align-items: center; pointer-events: none;
        }
        .ui-text {
            color: #fff; font-size: 18px; font-weight: bold;
            text-shadow: 2px 2px 0 #000; background: rgba(0,0,0,0.4);
            padding: 5px 10px; border-radius: 5px;
        }
        #skip-btn {
            pointer-events: auto; background: #e74c3c; color: white;
            border: none; padding: 8px 15px; font-weight: bold;
            border-radius: 5px; cursor: pointer; box-shadow: 0 4px 0 #c0392b;
        }
        #skip-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #c0392b; }
        #mobile-controls {
            width: 100%; height: 30vh; max-height: 120px;
            display: flex; justify-content: space-between;
            align-items: center; padding: 10px 40px;
            background: #111; pointer-events: auto;
        }
        .dpad { display: flex; gap: 20px; }
        .btn {
            width: 70px; height: 70px; background: #444;
            color: #fff; border-radius: 5px; display: flex;
            justify-content: center; align-items: center;
            font-size: 30px; font-weight: bold;
            box-shadow: 0 6px 0 #222; border: 2px solid #555;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #222; background: #555; }
        #screen-msg {
            position: absolute; top: 30%; left: 50%;
            transform: translate(-50%, -50%); text-align: center;
            display: none; pointer-events: auto; z-index: 100;
        }
        #screen-msg h1 { font-size: 40px; color: #fff; text-shadow: 3px 3px 0 #000; margin-bottom: 15px; }
        #screen-msg button {
            background: #2ecc71; color: white; border: none;
            padding: 12px 30px; font-size: 20px; font-weight: bold;
            border-radius: 5px; cursor: pointer; box-shadow: 0 5px 0 #27ae60;
        }
        #screen-msg button:active { transform: translateY(3px); box-shadow: 0 2px 0 #27ae60; }
    </style>
</head>
<body>

    <div id="orientation-warning">
        <h2>🔄 Пожалуйста, переверните устройство</h2>
        <p style="margin-top:10px;">Для игры необходим альбомный (горизонтальный) режим экрана.</p>
    </div>

    <div id="game-container">
        <div id="ui-overlay">
            <div id="stats" class="ui-text">Уровень: 1/5 | Смертей: 0</div>
            <button id="skip-btn">Пропустить ⏭️</button>
        </div>

        <div id="screen-msg">
            <h1 id="msg-title">ПОБЕДА!</h1>
            <button id="msg-btn">Дальше</button>
        </div>

        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <div id="mobile-controls">
            <div class="dpad">
                <div class="btn" id="btn-left">◀</div>
                <div class="btn" id="btn-right">▶</div>
            </div>
            <div class="btn" id="btn-jump">▲</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statsUI = document.getElementById('stats');
        const skipBtn = document.getElementById('skip-btn');
        const screenMsg = document.getElementById('screen-msg');
        const msgTitle = document.getElementById('msg-title');
        const msgBtn = document.getElementById('msg-btn');

        // Игровые переменные
        let currentLevel = 1;
        let deaths = 0;
        let gameState = 'playing'; // playing, won, lost

        // Физика игрока
        const player = {
            x: 50, y: 300, width: 24, height: 24,
            vx: 0, vy: 0, speed: 4.5, jumpForce: -10.5,
            grounded: false
        };

        const gravity = 0.55;

        // Кнопки управления (система Multi-touch)
        const keys = { left: false, right: false, jump: false };

        // Базовые структуры уровней
        let platforms = [];
        let traps = [];
        let portal = { x: 730, y: 280, width: 35, height: 50, targetX: 730 };

        function updateUI() {
            statsUI.innerText = `Уровень: ${currentLevel}/5 | Смертей: ${deaths}`;
        }

        function loadLevel(lvl) {
            gameState = 'playing';
            screenMsg.style.display = 'none';
            player.x = 50;
            player.y = 300;
            player.vx = 0; player.vy = 0;
            player.grounded = false;

            platforms = [
                { x: 0, y: 350, width: 800, height: 50, type: 'normal' } // Пол
            ];
            traps = [];
            portal.x = 730; portal.y = 280; portal.targetX = 730;

            if (lvl === 1) {
                // Уровень 1: Скрытые шипы
                platforms.push({ x: 300, y: 270, width: 150, height: 20, type: 'normal' });
                traps.push({ x: 350, y: 350, width: 30, height: 0, maxH: 30, triggered: false, triggerX: 280, type: 'hidden-spike' });
                traps.push({ x: 620, y: 350, width: 30, height: 0, maxH: 30, triggered: false, triggerX: 550, type: 'hidden-spike' });
            } 
            else if (lvl === 2) {
                // Уровень 2: Падающие сталактиты
                platforms.push({ x: 250, y: 260, width: 120, height: 20, type: 'normal' });
                platforms.push({ x: 480, y: 200, width: 120, height: 20, type: 'normal' });
                traps.push({ x: 300, y: 0, width: 25, height: 40, vy: 0, triggered: false, triggerX: 200, type: 'stalactite' });
                traps.push({ x: 530, y: 0, width: 25, height: 40, vy: 0, triggered: false, triggerX: 420, type: 'stalactite' });
            } 
            else if (lvl === 3) {
                // Уровень 3: Обрушение моста в бездну
                platforms = [
                    { x: 0, y: 350, width: 180, height: 50, type: 'normal' },
                    { x: 230, y: 310, width: 100, height: 20, type: 'falling', vy: 0, triggered: false },
                    { x: 420, y: 260, width: 100, height: 20, type: 'falling', vy: 0, triggered: false },
                    { x: 620, y: 350, width: 180, height: 50, type: 'normal' }
                ];
                portal.x = 720; portal.y = 280;
            } 
            else if (lvl === 4) {
                // Уровень 4: Лабиринт шипов и фейк
                platforms.push({ x: 200, y: 260, width: 400, height: 20, type: 'normal' });
                platforms.push({ x: 350, y: 160, width: 200, height: 20, type: 'normal' });
                // Шипы
                traps.push({ x: 280, y: 260, width: 30, height: 20, type: 'spike' });
                traps.push({ x: 450, y: 350, width: 40, height: 20, type: 'spike' });
                // Скрытый прямо на входе на платформу
                traps.push({ x: 210, y: 260, width: 25, height: 0, maxH: 22, triggered: false, triggerX: 150, type: 'hidden-spike' });
            } 
            else if (lvl === 5) {
                // Уровень 5: Убегающий финал
                platforms.push({ x: 180, y: 280, width: 100, height: 20, type: 'normal' });
                platforms.push({ x: 360, y: 230, width: 100, height: 20, type: 'normal' });
                platforms.push({ x: 540, y: 280, width: 100, height: 20, type: 'normal' });
                
                traps.push({ x: 400, y: 0, width: 30, height: 40, vy: 0, triggered: false, triggerX: 300, type: 'stalactite' });
                traps.push({ x: 220, y: 280, width: 25, height: 0, maxH: 20, triggered: false, triggerX: 180, type: 'hidden-spike' });
                
                // Триггер побега портала
                portal.targetX = 730;
                portal.triggered = false;
            }
            updateUI();
        }

        // Обработка ввода (Клавиатура)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'а') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'в') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'ц' || e.key === ' ') keys.jump = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'а') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'в') keys.right = false;
